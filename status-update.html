<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AccountFlow Pro | Task Status</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        :root {
            --primary: #1e3c72;
            --primary-dark: #0f2b4f;
            --secondary: #2a5298;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --light: #f3f4f6;
            --dark: #1f2937;
            --gray: #6b7280;
            --light-gray: #e5e7eb;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --radius: 12px;
            --transition: all 0.3s ease;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .logo i {
            font-size: 2rem;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.2);
            padding: 8px 20px;
            border-radius: 50px;
        }

        .user-avatar {
            width: 35px;
            height: 35px;
            background: var(--success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            text-transform: uppercase;
        }

        .logout-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .logout-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .back-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 5px;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            padding: 15px 30px;
            background: var(--light);
            border-bottom: 1px solid var(--light-gray);
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .nav-tab {
            padding: 8px 20px;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
            background: white;
            border: 1px solid var(--light-gray);
        }

        .nav-tab:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .nav-tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Main Content */
        .main-content {
            padding: 30px;
        }

        /* Welcome Banner */
        .welcome-banner {
            background: linear-gradient(135deg, #667eea20, #764ba220);
            border-radius: var(--radius);
            padding: 25px;
            margin-bottom: 30px;
            border-left: 4px solid var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .welcome-text h1 {
            font-size: 1.8rem;
            color: var(--dark);
            margin-bottom: 5px;
        }

        .welcome-text p {
            color: var(--gray);
        }

        .date-display {
            background: white;
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 20px;
            transition: var(--transition);
            border: 1px solid var(--light-gray);
            cursor: pointer;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-color: var(--primary);
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
        }

        .stat-icon.warning { background: var(--warning); }
        .stat-icon.info { background: var(--info); }
        .stat-icon.success { background: var(--success); }
        .stat-icon.primary { background: var(--primary); }
        .stat-icon.gray { background: var(--gray); }

        .stat-info h3 {
            font-size: 2rem;
            margin-bottom: 5px;
            color: var(--dark);
        }

        .stat-info p {
            color: var(--gray);
            font-size: 0.9rem;
        }

        /* Quick Actions */
        .quick-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 25px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #0ca678;
            transform: translateY(-2px);
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn-warning:hover {
            background: #e07b0b;
        }

        .btn-info {
            background: var(--info);
            color: white;
        }

        .btn-info:hover {
            background: #2563eb;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: white;
        }

        .btn-sm {
            padding: 8px 15px;
            font-size: 0.85rem;
        }

        /* View Type Selector */
        .view-type-selector {
            display: flex;
            gap: 10px;
            background: var(--light);
            padding: 5px;
            border-radius: 50px;
            margin-left: auto;
        }

        .view-type-btn {
            padding: 8px 15px;
            border: none;
            background: transparent;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            color: var(--gray);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .view-type-btn:hover {
            background: var(--primary);
            color: white;
        }

        .view-type-btn.active {
            background: var(--primary);
            color: white;
        }

        /* Filter Bar */
        .filter-bar {
            background: white;
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            border: 1px solid var(--light-gray);
        }

        .search-box {
            flex: 2;
            min-width: 250px;
            display: flex;
            align-items: center;
            background: var(--light);
            border-radius: 50px;
            padding: 8px 20px;
        }

        .search-box i {
            color: var(--gray);
            margin-right: 10px;
        }

        .search-box input {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            font-size: 0.95rem;
        }

        .filter-group {
            flex: 1;
            min-width: 150px;
        }

        .filter-select {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid var(--light-gray);
            border-radius: 50px;
            outline: none;
            font-size: 0.95rem;
            background: white;
            cursor: pointer;
        }

        /* Tasks Container */
        .tasks-container {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid var(--light-gray);
        }

        .tasks-header {
            padding: 20px;
            background: var(--light);
            border-bottom: 1px solid var(--light-gray);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .tasks-header h2 {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--dark);
        }

        .tasks-count {
            background: var(--primary);
            color: white;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.85rem;
        }

        /* Grid View */
        .tasks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        /* Table View */
        .tasks-table {
            width: 100%;
            border-collapse: collapse;
            padding: 20px;
        }

        .tasks-table th {
            background: var(--light);
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: var(--dark);
            border-bottom: 2px solid var(--primary);
        }

        .tasks-table td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--light-gray);
        }

        .tasks-table tr:hover {
            background: var(--light);
        }

        .tasks-table .action-buttons {
            display: flex;
            gap: 5px;
        }

        /* Kanban View */
        .kanban-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
            overflow-x: auto;
        }

        .kanban-column {
            background: var(--light);
            border-radius: var(--radius);
            padding: 15px;
            min-width: 300px;
        }

        .kanban-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--primary);
        }

        .kanban-header h3 {
            font-size: 1.1rem;
            color: var(--dark);
        }

        .kanban-count {
            background: var(--primary);
            color: white;
            padding: 3px 10px;
            border-radius: 50px;
            font-size: 0.85rem;
        }

        .kanban-items {
            min-height: 200px;
        }

        .kanban-item {
            background: white;
            border-radius: var(--radius);
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow);
        }

        .kanban-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .kanban-item.priority-high { border-left-color: var(--danger); }
        .kanban-item.priority-medium { border-left-color: var(--warning); }
        .kanban-item.priority-low { border-left-color: var(--success); }

        .kanban-item-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--dark);
        }

        .kanban-item-meta {
            font-size: 0.85rem;
            color: var(--gray);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .kanban-item-actions {
            display: flex;
            gap: 5px;
            justify-content: flex-end;
        }

        /* Task Item */
        .task-item {
            background: white;
            border-radius: var(--radius);
            border: 1px solid var(--light-gray);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .task-item:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow);
            border-color: var(--primary);
        }

        .task-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
        }

        .task-item.priority-high::before { background: var(--danger); }
        .task-item.priority-medium::before { background: var(--warning); }
        .task-item.priority-low::before { background: var(--success); }

        .task-content {
            padding: 20px;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .task-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .task-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-not-started { background: var(--gray); }
        .status-in-progress { background: var(--info); }
        .status-pending { background: var(--warning); }
        .status-on-hold { background: var(--warning); }
        .status-completed { background: var(--success); }

        .task-priority {
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .priority-high {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .priority-medium {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
        }

        .priority-low {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .company-badge {
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            background: var(--success);
            color: white;
        }

        .task-meta {
            display: flex;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--gray);
            font-size: 0.85rem;
        }

        .meta-item i {
            color: var(--primary);
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        /* Time Tracking */
        .timer-display {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary);
            text-align: center;
            margin: 10px 0;
            padding: 10px;
            background: var(--light);
            border-radius: var(--radius);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: var(--radius);
            width: 600px;
            max-width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: modalSlide 0.3s;
        }

        @keyframes modalSlide {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--light-gray);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .modal-header h3 {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .close-modal {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-modal:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.1);
        }

        .modal-body {
            padding: 25px;
        }

        .modal-footer {
            padding: 20px;
            border-top: 1px solid var(--light-gray);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .time-details {
            background: var(--light);
            border-radius: var(--radius);
            padding: 20px;
            margin: 20px 0;
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--light-gray);
        }

        .time-label {
            color: var(--gray);
            font-size: 0.9rem;
        }

        .time-value {
            font-weight: 600;
            color: var(--dark);
        }

        /* Alert Styles */
        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        /* Loading Spinner */
        .loading-spinner {
            display: none;
            text-align: center;
            padding: 50px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray);
        }

        .empty-state i {
            font-size: 4rem;
            color: var(--light-gray);
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            color: var(--dark);
            margin-bottom: 10px;
        }

        .empty-state p {
            margin-bottom: 20px;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .kanban-board {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .tasks-grid {
                grid-template-columns: 1fr;
            }
            
            .kanban-board {
                grid-template-columns: 1fr;
            }
            
            .view-type-selector {
                margin-left: 0;
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <i class="fas fa-clock"></i>
                <span>Task Status</span>
            </div>
            <div class="user-profile">
                <a href="index.html" class="back-btn">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">...</div>
                    <span id="userDisplayName">Loading...</span>
                </div>
                <button class="logout-btn" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <button class="nav-tab active" data-view="all">All Active</button>
            <button class="nav-tab" data-view="not-started">Not Started</button>
            <button class="nav-tab" data-view="in-progress">In Progress</button>
            <button class="nav-tab" data-view="pending">Pending</button>
            <button class="nav-tab" data-view="on-hold">On Hold</button>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Welcome Banner -->
            <div class="welcome-banner">
                <div class="welcome-text">
                    <h1>Task Status Update</h1>
                    <p>Track and update your active tasks</p>
                </div>
                <div class="date-display">
                    <i class="far fa-calendar-alt"></i>
                    <span id="currentDate"></span>
                </div>
            </div>

            <!-- Stats Cards -->
            <div class="stats-grid">
                <div class="stat-card" onclick="filterByStatus('all')">
                    <div class="stat-icon primary">
                        <i class="fas fa-tasks"></i>
                    </div>
                    <div class="stat-info">
                        <h3 id="totalActive">0</h3>
                        <p>Active Tasks</p>
                    </div>
                </div>
                <div class="stat-card" onclick="filterByStatus('not-started')">
                    <div class="stat-icon gray">
                        <i class="fas fa-circle"></i>
                    </div>
                    <div class="stat-info">
                        <h3 id="totalNotStarted">0</h3>
                        <p>Not Started</p>
                    </div>
                </div>
                <div class="stat-card" onclick="filterByStatus('in-progress')">
                    <div class="stat-icon info">
                        <i class="fas fa-spinner"></i>

                        <p>In Progress</p>

                <div class="stat-card" onclick="filterByStatus('pending')">
                    <div class="stat-icon warning">
                        <i class="fas fa-pause-circle"></i>
                    </div>
                    <div class="stat-info">
                        <h3 id="totalPending">0</h3>
                        <p>Pending</p>
                    </div>

                <i class="fas fa-check-circle"></i> <span id="successMessage"></span>
            </div>
            <div class="alert alert-error" id="errorAlert">
                <i class="fas fa-exclamation-circle"></i> <span id="errorMessage"></span>
            </div>
            <div class="alert alert-info" id="infoAlert">
                <i class="fas fa-info-circle"></i> <span id="infoMessage"></span>
            </div>

            <!-- Loading Spinner -->
            <div class="loading-spinner" id="loadingSpinner">
                <div class="spinner"></div>

            <!-- Quick Actions -->

                    <i class="fas fa-sync-alt"></i> Refresh

                    <button class="view-type-btn active" onclick="setViewType('grid')">
                        <i class="fas fa-th-large"></i> Grid
                    </button>
                    <button class="view-type-btn" onclick="setViewType('table')">
                        <i class="fas fa-table"></i> Table
                    </button>
                    <button class="view-type-btn" onclick="setViewType('kanban')">
                        <i class="fas fa-columns"></i> Kanban
                    </button>

            <!-- Filter Bar -->
            <div class="filter-bar">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search tasks...">
                </div>
                <div class="filter-group">
                    <select id="priorityFilter" class="filter-select">
                        <option value="all">All Priorities</option>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>
                </div>
                <div class="filter-group">
                    <select id="companyFilter" class="filter-select">
                        <option value="all">All Companies</option>
                    </select>
                </div>
            </div>

            <!-- Tasks Container -->
            <div class="tasks-container">
                <div class="tasks-header">
                    <h2>
                        <i class="fas fa-tasks"></i>
                        <span id="currentViewTitle">All Active Tasks</span>
                    </h2>
                    <span class="tasks-count" id="displayedTasksCount">0 tasks</span>
                </div>
                <div id="tasksWrapper"></div>
            </div>
        </div>

    <!-- Time Details Modal -->
    <div class="modal" id="timeModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-clock"></i> Time Details</h3>
                <button class="close-modal" id="closeTimeModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <h3 id="modalTaskTitle" style="color: var(--primary); margin-bottom: 20px;"></h3>
                
                <div class="time-details">
                    <div class="time-row">
                        <span class="time-label">Started:</span>
                        <span class="time-value" id="modalStarted">-</span>
                    </div>
                    <div class="time-row">
                        <span class="time-label">Last Updated:</span>
                        <span class="time-value" id="modalUpdated">-</span>
                    </div>
                    <div class="time-row">
                        <span class="time-label">Status:</span>
                        <span class="time-value" id="modalStatus">-</span>
                    </div>
                    <div class="time-row">
                        <span class="time-label">Total Time:</span>
                        <span class="time-value" id="modalTotalTime">0h 0m</span>
                    </div>
                </div>

                <div class="timer-display" id="modalTimer">00:00:00</div>
            </div>
            <div class="modal-footer">
                <button class="btn" id="closeTimeModalBtn2">Close</button>
            </div>
        </div>
    </div>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDYIqCBf1qwo1dUaHVs572MiXO82vmy6lE",
            authDomain: "task-for-169b3.firebaseapp.com",
            projectId: "task-for-169b3",
            storageBucket: "task-for-169b3.appspot.com",
            messagingSenderId: "784532517839",
            appId: "1:784532517839:web:3b7c665126908f2a70d8ba"
        };

        // Initialize Firebase
        let auth, db;
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            auth = firebase.auth();
            db = firebase.firestore();
            
            db.enablePersistence()
                .catch((err) => {
                    console.log('Persistence error:', err);
                });
                
            console.log("✅ Firebase initialized");
        } catch (error) {
            console.error("❌ Firebase error:", error);
        }

        // DOM Elements
        const userAvatar = document.getElementById('userAvatar');
        const userDisplayName = document.getElementById('userDisplayName');
        const logoutBtn = document.getElementById('logoutBtn');
        const searchInput = document.getElementById('searchInput');
        const priorityFilter = document.getElementById('priorityFilter');
        const companyFilter = document.getElementById('companyFilter');
        const tasksWrapper = document.getElementById('tasksWrapper');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const displayedTasksCount = document.getElementById('displayedTasksCount');
        const currentViewTitle = document.getElementById('currentViewTitle');
        const navTabs = document.querySelectorAll('.nav-tab');

        // Stats elements
        const totalActive = document.getElementById('totalActive');
        const totalNotStarted = document.getElementById('totalNotStarted');
        const totalInProgress = document.getElementById('totalInProgress');
        const totalPending = document.getElementById('totalPending');

        // Modal elements
        const timeModal = document.getElementById('timeModal');
        const closeTimeModalBtn = document.getElementById('closeTimeModalBtn');
        const closeTimeModalBtn2 = document.getElementById('closeTimeModalBtn2');

        // Alert elements
        const successAlert = document.getElementById('successAlert');
        const errorAlert = document.getElementById('errorAlert');
        const infoAlert = document.getElementById('infoAlert');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');
        const infoMessage = document.getElementById('infoMessage');

        // Global variables
        let currentUser = null;
        let allTasks = [];
        let filteredTasks = [];
        let departments = [];
        let accountTypes = [];
        let companies = new Set();
        let currentViewType = 'grid';
        let currentStatusFilter = 'all';
        let activeTimers = {};
        let currentViewingTask = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            setCurrentDate();
            setupEventListeners();
            startTimerUpdates();
        });

        function checkAuth() {
            userDisplayName.textContent = 'Loading...';
            userAvatar.textContent = '...';
            
            auth.onAuthStateChanged(user => {
                if (user) {
                    console.log("✅ User authenticated:", user.email);
                    currentUser = user;
                    
                    loadUserData();
                    loadDepartments();
                    loadAccountTypes();
                    loadTasks();
                } else {
                    console.log("❌ No user authenticated, redirecting to login");
                    window.location.href = 'index.html';
                }
            });
        }

        function loadUserData() {
            if (!currentUser || !currentUser.email) return;
            
            const emailName = currentUser.email.split('@')[0];
            const displayName = emailName.charAt(0).toUpperCase() + emailName.slice(1);
            
            userDisplayName.textContent = displayName;
            userAvatar.textContent = displayName.charAt(0).toUpperCase();
        }

        function loadDepartments() {
            db.collection('departments')
                .where('userId', '==', currentUser.uid)
                .get()
                .then(snapshot => {
                    departments = [];
                    snapshot.forEach(doc => {
                        departments.push({
                            id: doc.id,
                            ...doc.data()
                        });
                    });
                })
                .catch(err => console.error("Error loading departments:", err));
        }

        function loadAccountTypes() {
            db.collection('accountTypes')
                .where('userId', '==', currentUser.uid)
                .get()
                .then(snapshot => {
                    accountTypes = [];
                    snapshot.forEach(doc => {
                        accountTypes.push({
                            id: doc.id,
                            ...doc.data()
                        });
                    });
                })
                .catch(err => console.error("Error loading account types:", err));
        }

        // Load Tasks (excluding completed)
        function loadTasks() {
            showLoading();
            
            db.collection('tasks')
                .where('userId', '==', currentUser.uid)
                .get()
                .then(snapshot => {
                    allTasks = [];
                    companies.clear();
                    
                    snapshot.forEach(doc => {
                        const task = doc.data();
                        task.id = doc.id;
                        
                        // Only include non-completed tasks
                        if (task.status !== 'completed') {
                            allTasks.push(task);
                            
                            // Collect unique companies for filter
                            if (task.company) {
                                companies.add(task.company);
                            }
                        }
                    });
                    
                    console.log(`Loaded ${allTasks.length} active tasks`);
                    
                    updateCompanyFilter();
                    updateStats();
                    filterAndSortTasks();
                    hideLoading();
                })
                .catch(err => {
                    console.error("Error loading tasks:", err);
                    showError("Failed to load tasks");
                    hideLoading();
                });
        }

        function updateCompanyFilter() {
            companyFilter.innerHTML = '<option value="all">All Companies</option>';
            Array.from(companies).sort().forEach(company => {
                companyFilter.innerHTML += `<option value="${company}">${company}</option>`;
            });
        }

        function updateStats() {
            totalActive.textContent = allTasks.length;
            totalNotStarted.textContent = allTasks.filter(t => t.status === 'not-started').length;
            totalInProgress.textContent = allTasks.filter(t => t.status === 'in-progress').length;
            totalPending.textContent = allTasks.filter(t => t.status === 'pending' || t.status === 'on-hold').length;
        }

        // Filter and Sort Tasks
        function filterAndSortTasks() {
            // Apply status filter from nav tabs
            if (currentStatusFilter === 'all') {
                filteredTasks = [...allTasks];
                currentViewTitle.textContent = 'All Active Tasks';
            } else if (currentStatusFilter === 'pending') {
                filteredTasks = allTasks.filter(t => t.status === 'pending' || t.status === 'on-hold');
                currentViewTitle.textContent = 'Pending Tasks';
            } else {
                filteredTasks = allTasks.filter(t => t.status === currentStatusFilter);
                currentViewTitle.textContent = currentStatusFilter.split('-').map(word => 
                    word.charAt(0).toUpperCase() + word.slice(1)
                ).join(' ') + ' Tasks';
            }
            
            // Apply search
            const searchTerm = searchInput.value.toLowerCase();
            if (searchTerm) {
                filteredTasks = filteredTasks.filter(t => 
                    (t.title?.toLowerCase().includes(searchTerm)) ||
                    (t.description?.toLowerCase().includes(searchTerm)) ||
                    (t.company?.toLowerCase().includes(searchTerm))
                );
            }
            
            // Apply priority filter
            const priority = priorityFilter.value;
            if (priority !== 'all') {
                filteredTasks = filteredTasks.filter(t => t.priority === priority);
            }
            
            // Apply company filter
            const company = companyFilter.value;
            if (company !== 'all') {
                filteredTasks = filteredTasks.filter(t => t.company === company);
            }
            
            renderTasks();
        }

        // Render Tasks based on view type
        function renderTasks() {
            displayedTasksCount.textContent = `${filteredTasks.length} task${filteredTasks.length !== 1 ? 's' : ''}`;
            
            if (filteredTasks.length === 0) {
                tasksWrapper.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-check-circle"></i>
                        <h3>No active tasks found</h3>
                        <p>All tasks are completed! Great job!</p>
                    </div>
                `;
                return;
            }
            
            switch(currentViewType) {
                case 'grid':
                    renderGridView();
                    break;
                case 'table':
                    renderTableView();
                    break;
                case 'kanban':
                    renderKanbanView();
                    break;
                default:
                    renderGridView();
            }
        }

        // Render Grid View
        function renderGridView() {
            tasksWrapper.className = 'tasks-grid';
            tasksWrapper.innerHTML = filteredTasks.map(task => createTaskHTML(task)).join('');
        }

        // Render Table View
        function renderTableView() {
            tasksWrapper.innerHTML = `
                <table class="tasks-table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Company</th>
                            <th>Status</th>
                            <th>Priority</th>
                            <th>Due Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${filteredTasks.map(task => `
                            <tr>
                                <td>${task.title}</td>
                                <td>${task.company || '-'}</td>
                                <td><span class="task-status status-${task.status || 'not-started'}"></span> ${task.status || 'not-started'}</td>
                                <td><span class="task-priority priority-${task.priority || 'medium'}">${task.priority || 'medium'}</span></td>
                                <td>${task.dueDate || '-'}</td>
                                <td>
                                    <div class="action-buttons">
                                        ${getActionButtons(task, 'icon')}
                                        <button class="btn btn-info btn-sm" onclick="showTimeDetails('${task.id}')" title="Time Details">
                                            <i class="fas fa-clock"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        // Render Kanban View
        function renderKanbanView() {
            const columns = {
                'not-started': 'Not Started',
                'in-progress': 'In Progress',
                'pending': 'Pending',
                'on-hold': 'On Hold'
            };
            
            tasksWrapper.innerHTML = `
                <div class="kanban-board">
                    ${Object.entries(columns).map(([status, label]) => {
                        const columnTasks = filteredTasks.filter(t => t.status === status);
                        return `
                            <div class="kanban-column">
                                <div class="kanban-header">
                                    <h3>${label}</h3>
                                    <span class="kanban-count">${columnTasks.length}</span>
                                </div>
                                <div class="kanban-items">
                                    ${columnTasks.map(task => `
                                        <div class="kanban-item priority-${task.priority || 'medium'}">
                                            <div class="kanban-item-title">${task.title}</div>
                                            <div class="kanban-item-meta">
                                                <span><i class="fas fa-building"></i> ${task.company || 'No company'}</span>
                                                <span><i class="far fa-calendar"></i> ${task.dueDate || 'No date'}</span>
                                            </div>
                                            <div class="kanban-item-actions">
                                                ${getActionButtons(task, 'icon')}
                                                <button class="btn btn-info btn-sm" onclick="showTimeDetails('${task.id}')" title="Time Details">
                                                    <i class="fas fa-clock"></i>
                                                </button>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        // Create Task HTML for Grid View
        function createTaskHTML(task) {
            return `
                <div class="task-item priority-${task.priority || 'medium'}" data-task-id="${task.id}">
                    <div class="task-content">
                        <div class="task-header">
                            <div class="task-title">
                                <span class="task-status status-${task.status || 'not-started'}"></span>
                                ${task.title}
                            </div>
                            <span class="task-priority priority-${task.priority || 'medium'}">
                                ${(task.priority || 'medium').toUpperCase()}
                            </span>
                        </div>
                        
                        ${task.company ? `
                            <div style="margin-bottom: 10px;">
                                <span class="company-badge"><i class="fas fa-building"></i> ${task.company}</span>
                            </div>
                        ` : ''}
                        
                        <div class="task-meta">
                            <span class="meta-item">
                                <i class="far fa-calendar-alt"></i> Due: ${task.dueDate || 'No date'}
                            </span>
                            <span class="meta-item">
                                <i class="fas fa-tag"></i> ${task.status || 'not-started'}
                            </span>
                        </div>
                        
                        ${task.status === 'in-progress' ? `
                            <div class="timer-display" id="timer-${task.id}">
                                ${formatTime(activeTimers[task.id] || 0)}
                            </div>
                        ` : ''}
                        
                        <div class="action-buttons">
                            ${getActionButtons(task)}
                            <button class="btn btn-info btn-sm" onclick="showTimeDetails('${task.id}')">
                                <i class="fas fa-clock"></i> Details
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Get Action Buttons based on status
        function getActionButtons(task, type = 'full') {
            if (type === 'icon') {
                switch(task.status) {
                    case 'not-started':
                        return `<button class="btn btn-primary btn-sm" onclick="startTask('${task.id}')" title="Start"><i class="fas fa-play"></i></button>`;
                    case 'in-progress':
                        return `
                            <button class="btn btn-warning btn-sm" onclick="pauseTask('${task.id}')" title="Pause"><i class="fas fa-pause"></i></button>
                            <button class="btn btn-success btn-sm" onclick="completeTask('${task.id}')" title="Complete"><i class="fas fa-check"></i></button>
                        `;
                    case 'pending':
                    case 'on-hold':
                        return `
                            <button class="btn btn-primary btn-sm" onclick="resumeTask('${task.id}')" title="Resume"><i class="fas fa-play"></i></button>
                            <button class="btn btn-success btn-sm" onclick="completeTask('${task.id}')" title="Complete"><i class="fas fa-check"></i></button>
                        `;
                    default:
                        return '';
                }
            } else {
                switch(task.status) {
                    case 'not-started':
                        return `<button class="btn btn-primary btn-sm" onclick="startTask('${task.id}')"><i class="fas fa-play"></i> Start</button>`;
                    case 'in-progress':
                        return `
                            <button class="btn btn-warning btn-sm" onclick="pauseTask('${task.id}')"><i class="fas fa-pause"></i> Pause</button>
                            <button class="btn btn-success btn-sm" onclick="completeTask('${task.id}')"><i class="fas fa-check"></i> Complete</button>
                        `;
                    case 'pending':
                    case 'on-hold':
                        return `
                            <button class="btn btn-primary btn-sm" onclick="resumeTask('${task.id}')"><i class="fas fa-play"></i> Resume</button>
                            <button class="btn btn-success btn-sm" onclick="completeTask('${task.id}')"><i class="fas fa-check"></i> Complete</button>
                        `;
                    default:
                        return '';
                }
            }
        }

        // Task Action Functions
        function startTask(taskId) {
            const task = allTasks.find(t => t.id === taskId);
            if (!task) return;
            
            db.collection('tasks').doc(taskId).update({
                status: 'in-progress',
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                // Create time tracking record
                db.collection('timeTracking').add({
                    taskId: taskId,
                    userId: currentUser.uid,
                    status: 'in-progress',
                    startedAt: new Date().toISOString(),
                    lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    showSuccess(`Started: ${task.title}`);
                    startTaskTimer(taskId);
                    loadTasks();
                });
            }).catch(err => {
                console.error("Error starting task:", err);
                showError("Failed to start task");
            });
        }

        function pauseTask(taskId) {
            const task = allTasks.find(t => t.id === taskId);
            if (!task) return;
            
            const now = new Date();
            const elapsedSeconds = activeTimers[taskId] || 0;
            
            db.collection('tasks').doc(taskId).update({
                status: 'pending',
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                // Update time tracking
                db.collection('timeTracking')
                    .where('taskId', '==', taskId)
                    .where('status', '==', 'in-progress')
                    .get()
                    .then(snapshot => {
                        snapshot.forEach(doc => {
                            const track = doc.data();
                            const totalSeconds = (track.totalSeconds || 0) + elapsedSeconds;
                            
                            doc.ref.update({
                                status: 'pending',
                                totalSeconds: totalSeconds,
                                pausedAt: now.toISOString(),
                                lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        });
                    });
                
                showSuccess(`Paused: ${task.title}`);
                stopTaskTimer(taskId);
                loadTasks();
            }).catch(err => {
                console.error("Error pausing task:", err);
                showError("Failed to pause task");
            });
        }

        function resumeTask(taskId) {
            const task = allTasks.find(t => t.id === taskId);
            if (!task) return;
            
            db.collection('tasks').doc(taskId).update({
                status: 'in-progress',
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                // Update time tracking
                db.collection('timeTracking')
                    .where('taskId', '==', taskId)
                    .where('status', '==', 'pending')
                    .get()
                    .then(snapshot => {
                        snapshot.forEach(doc => {
                            doc.ref.update({
                                status: 'in-progress',
                                resumedAt: new Date().toISOString(),
                                lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        });
                    });
                
                showSuccess(`Resumed: ${task.title}`);
                startTaskTimer(taskId);
                loadTasks();
            }).catch(err => {
                console.error("Error resuming task:", err);
                showError("Failed to resume task");
            });
        }

        function completeTask(taskId) {
            const task = allTasks.find(t => t.id === taskId);
            if (!task) return;
            
            const now = new Date();
            const elapsedSeconds = activeTimers[taskId] || 0;
            
            db.collection('tasks').doc(taskId).update({
                status: 'completed',
                completedAt: firebase.firestore.FieldValue.serverTimestamp(),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                // Update time tracking
                db.collection('timeTracking')
                    .where('taskId', '==', taskId)
                    .where('status', 'in', ['in-progress', 'pending'])
                    .get()
                    .then(snapshot => {
                        snapshot.forEach(doc => {
                            const track = doc.data();
                            const totalSeconds = (track.totalSeconds || 0) + 
                                (track.status === 'in-progress' ? elapsedSeconds : 0);
                            
                            doc.ref.update({
                                status: 'completed',
                                totalSeconds: totalSeconds,
                                completedAt: now.toISOString(),
                                lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        });
                    });
                
                showSuccess(`✅ Task completed: ${task.title}`);
                stopTaskTimer(taskId);
                loadTasks();
            }).catch(err => {
                console.error("Error completing task:", err);
                showError("Failed to complete task");
            });
        }

        // Timer Functions
        function startTaskTimer(taskId) {
            if (!activeTimers[taskId]) {
                activeTimers[taskId] = 0;
                
                const interval = setInterval(() => {
                    if (activeTimers[taskId] !== undefined) {
                        activeTimers[taskId] += 1;
                        const timerElement = document.getElementById(`timer-${taskId}`);
                        if (timerElement) {
                            timerElement.textContent = formatTime(activeTimers[taskId]);
                        }
                    } else {
                        clearInterval(interval);
                    }
                }, 1000);
                
                activeTimers[`${taskId}_interval`] = interval;
            }
        }

        function stopTaskTimer(taskId) {
            if (activeTimers[`${taskId}_interval`]) {
                clearInterval(activeTimers[`${taskId}_interval`]);
                delete activeTimers[`${taskId}_interval`];
            }
            delete activeTimers[taskId];
        }

        function startTimerUpdates() {
            setInterval(() => {
                Object.keys(activeTimers).forEach(taskId => {
                    if (!taskId.includes('_interval') && activeTimers[taskId] > 0) {
                        // Update time tracking in Firestore periodically
                        db.collection('timeTracking')
                            .where('taskId', '==', taskId)
                            .where('status', '==', 'in-progress')
                            .get()
                            .then(snapshot => {
                                snapshot.forEach(doc => {
                                    doc.ref.update({
                                        totalSeconds: firebase.firestore.FieldValue.increment(activeTimers[taskId]),
                                        lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                                    });
                                });
                                activeTimers[taskId] = 0; // Reset after saving
                            });
                    }
                });
            }, 60000); // Every minute
        }

        // Show Time Details Modal
        function showTimeDetails(taskId) {
            const task = allTasks.find(t => t.id === taskId);
            if (!task) return;
            
            currentViewingTask = task;
            
            document.getElementById('modalTaskTitle').textContent = task.title;
            
            // Load time tracking data
            db.collection('timeTracking')
                .where('taskId', '==', taskId)
                .orderBy('startedAt', 'desc')
                .limit(1)
                .get()
                .then(snapshot => {
                    if (!snapshot.empty) {
                        const track = snapshot.docs[0].data();
                        
                        document.getElementById('modalStarted').textContent = 
                            track.startedAt ? new Date(track.startedAt).toLocaleString() : '-';
                        document.getElementById('modalUpdated').textContent = 
                            track.lastUpdated ? new Date(track.lastUpdated.toDate()).toLocaleString() : '-';
                        document.getElementById('modalStatus').textContent = track.status || '-';
                        
                        const totalSeconds = track.totalSeconds || 0;
                        document.getElementById('modalTotalTime').textContent = formatDuration(totalSeconds);
                        
                        if (task.status === 'in-progress' && activeTimers[taskId]) {
                            document.getElementById('modalTimer').textContent = formatTime(activeTimers[taskId]);
                        } else {
                            document.getElementById('modalTimer').textContent = formatTime(0);
                        }
                    } else {
                        document.getElementById('modalStarted').textContent = '-';
                        document.getElementById('modalUpdated').textContent = '-';
                        document.getElementById('modalStatus').textContent = task.status || '-';
                        document.getElementById('modalTotalTime').textContent = '0h 0m';
                        document.getElementById('modalTimer').textContent = '00:00:00';
                    }
                });
            
            timeModal.style.display = 'flex';
        }

        // Refresh Tasks
        function refreshTasks() {
            loadTasks();
        }

        // Set View Type
        function setViewType(type) {
            currentViewType = type;
            document.querySelectorAll('.view-type-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.innerHTML.includes(type)) {
                    btn.classList.add('active');
                }
            });
            renderTasks();
        }

        // Filter by Status
        function filterByStatus(status) {
            navTabs.forEach(t => t.classList.remove('active'));
            const tab = Array.from(navTabs).find(t => t.dataset.view === status);
            if (tab) tab.classList.add('active');
            currentStatusFilter = status;
            filterAndSortTasks();
        }

        // Utility Functions
        function formatDuration(seconds) {
            if (!seconds) return '0h 0m';
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            return `${hours}h ${minutes}m`;
        }

        function formatTime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function setCurrentDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-US', options);
        }

        // Alert Functions
        function showLoading() {
            loadingSpinner.style.display = 'block';
        }

        function hideLoading() {
            loadingSpinner.style.display = 'none';
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successAlert.style.display = 'flex';
            setTimeout(() => successAlert.style.display = 'none', 3000);
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorAlert.style.display = 'flex';
            setTimeout(() => errorAlert.style.display = 'none', 3000);
        }

        function showInfo(message) {
            infoMessage.textContent = message;
            infoAlert.style.display = 'flex';
            setTimeout(() => infoAlert.style.display = 'none', 3000);
        }

        // Setup Event Listeners
        function setupEventListeners() {
            logoutBtn.addEventListener('click', () => {
                auth.signOut().then(() => window.location.href = 'index.html');
            });
            
            searchInput.addEventListener('input', filterAndSortTasks);
            priorityFilter.addEventListener('change', filterAndSortTasks);
            companyFilter.addEventListener('change', filterAndSortTasks);
            
            navTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    navTabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentStatusFilter = tab.dataset.view;
                    filterAndSortTasks();
                });
            });
            
            closeTimeModalBtn.addEventListener('click', () => timeModal.style.display = 'none');
            closeTimeModalBtn2.addEventListener('click', () => timeModal.style.display = 'none');
        }

        // Make functions global
        window.filterByStatus = filterByStatus;
        window.setViewType = setViewType;
        window.refreshTasks = refreshTasks;
        window.startTask = startTask;
        window.pauseTask = pauseTask;
        window.resumeTask = resumeTask;
        window.completeTask = completeTask;
        window.showTimeDetails = showTimeDetails;
    </script>
</body>
</html>
